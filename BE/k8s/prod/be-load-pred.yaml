# 예측 적재 CronJob (S15P21A104-307).
#
# AI 배치가 매일 만드는 예측 산출물을 prod DB 에 넣는다. 지금까지 이 일이 수동이라
# bike_stock_pred 가 09-17 이후 닷새 방치됐고 아무도 몰랐다.
#
# 산출물이 있는 워커 노드에 파드를 고정하고 그 폴더를 읽기 전용으로 마운트한다 —
# scp 도 pem 키도 필요 없다. 같은 노드에 be 파드가 이미 뜨는 것을 확인했다(2026-09-22).
#
# 이미지·설정은 전부 기존 것을 그대로 쓴다. 적재 코드가 같은 jar 에 있고(application-load.yml),
# DB 접속은 be-config + data-secret 이 준다. 새로 복제하는 값이 없다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: be-load-pred
spec:
  # 10:00 KST. 따릉이 배치 03:00 · 혼잡도 배치 09:31(+지연 ≤5분) 뒤라 둘 다 최신이다.
  # 클러스터는 UTC 로 해석하므로 01:00 UTC 로 적는다.
  schedule: "0 1 * * *"
  timeZone: Etc/UTC
  # 앞 실행이 안 끝났으면 건너뛴다 — 같은 표를 두 번 쓰지 않게.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # 실패 기록을 남겨야 "며칠째 안 들어가고 있다" 를 알 수 있다 — 이번 사고의 원인이다.
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 적재는 upsert 라 멱등적이다. 오래 매달리지 않게 상한을 둔다.
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          # AI 산출물이 이 노드의 디스크에 있다. 다른 노드에 뜨면 폴더가 비어 있다.
          nodeSelector:
            kubernetes.io/hostname: ip-172-26-10-6
          containers:
            - name: be-load-pred
              image: sumgil-be:latest
              imagePullPolicy: IfNotPresent
              args:
                - "--load.sources=bikepred,crowdpred"
              envFrom:
                # DB_URL·DB_USERNAME 등 (낮 파드와 같은 값)
                - configMapRef:
                    name: be-config
                - secretRef:
                    name: data-secret
              env:
                # be-config 의 SPRING_PROFILES_ACTIVE=prod 를 덮는다. load 프로파일은
                # 웹서버를 안 띄우고 StaticLoadRunner 만 돌린 뒤 종료한다.
                - name: SPRING_PROFILES_ACTIVE
                  value: load
                # application-load.yml 의 기본값은 저장소 기준 상대경로라 컨테이너에선 안 맞는다.
                - name: LOAD_BIKEPRED_CSVPATH
                  value: /ai-data/BIKE/serving
                - name: LOAD_CROWDPRED_PATH
                  value: /ai-data/CROWD/serving
              volumeMounts:
                - name: ai-data
                  mountPath: /ai-data
                  readOnly: true
          volumes:
            # AI 파트 소유 폴더다. 읽기만 한다 — 산출물을 건드리지 않는다.
            - name: ai-data
              hostPath:
                path: /home/ubuntu/Soomgil-INFRA-ai-data-monitoring/AI/data
                type: Directory
