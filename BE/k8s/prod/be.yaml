# BE 워크로드 (S15P21A104-126). 비민감은 ConfigMap, 데이터·앱 비밀은 각 Secret에서 주입한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
spec:
  # replicas 1 고정 (S15P21A104-210). EC2 2대 + 데이터 계층 상주라 여유 없음.
  # 롤아웃 중 잠깐 끊긴다 (RollingUpdate 기본값). 무중단이 필요해지면 2와 함께 올린다.
  replicas: 1
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
        - name: be
          image: sumgil-be:latest
          # SHA 태그는 불변이라 재pull이 필요 없다. :latest는 호환용으로만 push된다.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: be-config
            - secretRef:
                name: data-secret
            # 앱 비밀 전체(275). 카카오 키와 함께 버스 혼잡도용 DATA_GO_KR_KEY(297)도 여기로 들어온다 —
            # 키별 secretKeyRef 를 따로 두지 않는다. Secret 에 그 키가 없으면 환경변수가 안 생기고
            # 앱이 기능을 스스로 끄므로(BusCongestionProperties.usable) 변수 등록 전에도 안 깨진다.
            - secretRef:
                name: be-secret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
---
apiVersion: v1
kind: Service
metadata:
  name: be
spec:
  selector:
    app: be
  ports:
    - port: 8080
