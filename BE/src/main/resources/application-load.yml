# 정적 데이터 적재 프로파일. API 서버를 띄우지 않고 StaticLoadRunner 만 실행한 뒤 종료한다.
# 실행: SPRING_PROFILES_ACTIVE=local,load ./gradlew bootRun --args='--load.dry-run=true'
# DB 접속은 local 프로파일(application-local.yml) 또는 DB_URL 등 환경변수로 받는다.
spring:
  main:
    web-application-type: none
  jpa:
    show-sql: false

load:
  sources: subway,bus,bike,railgeometry,congestion,busheadway   # 한 명령으로 전부. 골라 실행: --load.sources=bus,bike
                                                     # congestion 은 station·line 을, busheadway 는 bus_route 를 참조하므로 뒤에 온다
  dry-run: false
  write-mode: BATCH      # ROW 는 성능 비교용 baseline (BE/docs/perf)
  region: []             # 비어 있으면 전 노선. 예: --load.region=1002,1005
  avg-speed-mps: 9.2     # 소요시간 없는 구간 추정용 기본 표정속도 (1.1 km ≈ 2분). 노선별 값은 data/subway/conf/line-speeds.csv 가 우선
  prune: true            # 시각표가 덮는 노선에서 이번 실행에 없는 edge_time 행·고아 역 삭제. dry-run 은 건수만 출력

  # 따릉이 재고 예측(bikepred) 원천. 기본 sources 에는 없다 — 원천 파일을 먼저 받아야 하므로 따로 실행한다:
  #   ./gradlew bootRun --args='--load.sources=bikepred'
  # 파일 받기: node scripts/data/bikepred-fetch.mjs (AI EC2 의 최신 산출물을 아래 경로로 내려받는다)
  bikepred:
    source: csv          # 지금은 csv 뿐이다. AI 서빙 API 는 대여소 단위 조회 창구라 적재 원천이 아니다(BikeStockPredSource javadoc)
    path: ../AI/data/BIKE/serving        # 폴더면 그 안의 최신 bike_stock_pred_*.csv 를 쓴다. 파일을 직접 지정해도 된다
                                         # 2026-09-22(307): 키가 csv-path 였는데 레코드 성분은 path 라 어디에도 안 붙는
                                         # 죽은 키였다. 값이 같아 동작은 같았지만, 덮어쓰려다 안 먹어 CronJob 이 기본 경로를 읽었다

  # 혼잡도 예측(crowdpred) 원천. bikepred 와 같은 이유로 기본 sources 에 없다 — 원천 파일을 먼저 받아야 한다:
  #   ./gradlew bootRun --args='--load.sources=crowdpred'
  # 파일 받기: node scripts/data/crowdpred-fetch.mjs (AI EC2 의 최신 산출물 + 사이드카 meta 를 아래 경로로)
  crowdpred:
    source: csv          # 지금은 csv 뿐이다. AI 는 PG 에 직접 쓰지 않고 BE load job 이 넣는다(회신 04 L-2)
    path: ../AI/data/CROWD/serving      # 폴더면 그 안의 최신 predictions_<날짜>_<시각>.csv 를 쓴다
                                        # 사이드카 .meta.json 은 필수다 — generated_at 이 NOT NULL 열이고 행 수 대조에 쓴다

  # 따릉이 날짜축 예측(bikepreddaily, lightgbm) 원천 (S15P21A104-309). 기본 sources 에 없다:
  #   ./gradlew bootRun --args='--load.sources=bikepreddaily'
  # 요일축(bikepred)과 폴더를 나눈다 — 두 산출물 파일명 규칙이 bike_stock_pred_<시각>.csv 로 같아서
  # 한 폴더에 섞이면 서로를 집는다. 날짜축인지는 사이드카 target_date 로 가린다
  bikepreddaily:
    source: csv
    path: ../AI/data/BIKE/serving-daily  # 폴더면 대상 날짜마다 generated_at 최신 회차 하나씩. 사이드카 필수
