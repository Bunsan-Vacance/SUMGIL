spring:
  application:
    name: s15p21a104
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    # FE 로컬 개발 서버 기본값(Vite). 각자 환경(다른 포트·팀원 PC의 LAN IP)이 다르면
    # APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://192.168.0.10:5173 형태로 덮어쓴다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  kakao:
    # 도보 경로 조회 REST API 키(S15P21A104-186). 비어 있으면 WALK geometry는 항상 unavailable.
    rest-api-key: ${KAKAO_REST_API_KEY:}
  kakao-bike:
    # 자전거 경로 조회(S15P21A104-222). 도보와 같은 카카오 앱·키를 그대로 쓴다(엔드포인트만 다름).
    rest-api-key: ${KAKAO_REST_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
