spring:
  application:
    name: s15p21a104
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    # FE 로컬 개발 서버 기본값(Vite). 각자 환경(다른 포트·팀원 PC의 LAN IP)이 다르면
    # APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://192.168.0.10:5173 형태로 덮어쓴다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
