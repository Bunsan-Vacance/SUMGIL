plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	// splunk-library-javalogging은 Maven Central에 없고 Splunk 자체 Artifactory에만 있다.
	maven { url 'https://splunk.jfrog.io/splunk/ext-releases-local' }
}

dependencyManagement {
	imports {
		mavenBom 'me.paulschwarz:spring-dotenv-bom:5.1.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
	// splunk-demo 프로파일 전용 HEC 로그 전송 (BE/docs/infra/splunk-siem-design.md, 개인 로컬 데모용)
	implementation 'com.splunk.logging:splunk-library-javalogging:1.11.11'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// bootRun 전용 .env 로더 (BE/.env). 프로파일 없이도 DB 접속되게 한다.
	developmentOnly 'me.paulschwarz:springboot4-dotenv'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Kafka 프로듀서 (S15P21A104-169 수집기, collect 프로파일). 스타터(spring-boot-starter-kafka)가 아니라 spring-kafka 만 올려
	// 자동 구성이 붙지 않게 한다 — Kafka 빈은 CollectConfig 에서 collect 프로파일일 때만 만들어지고, API 서버 컨텍스트에는
	// 생기지 않는다(BE/README.md 9절: 서버는 외부를 폴링하지 않는다). 버전은 Boot BOM (spring-kafka 4.1.1 / kafka-clients 4.2.1).
	implementation 'org.springframework.kafka:spring-kafka'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
