# AI 호스트 프로세스 연결 (임시, S15P21A104-211 이미지 전까지).
# AI FastAPI는 파드가 아니라 J15A104A 호스트의 systemd `ai-api.service`(uvicorn, Tailscale 100.64.193.109:8000)로 돈다.
# Service에 selector가 없는 이유: 파드가 없으므로 아래 EndpointSlice가 대상(호스트 IP)을 직접 지정한다.
# 대상 IP가 Tailscale인 이유: ingress-nginx 파드(control-plane)에서 100.64.193.109:8000/health 200 확인됨
#   → 호스트 bind·ufw 변경 없이 라우팅된다.
# 롤백: kubectl delete -f 이 파일 (Ingress는 ingress.yaml, 별도 유지)
# 이미지로 전환할 때 되돌릴 것: 이 파일을 Deployment+Service(selector app: ai)로 교체하고 EndpointSlice `ai-host`를 삭제한다.
#   (Service 이름 `ai`·포트 8000은 Ingress가 참조하므로 유지)
# namespace는 kustomization이 넣는다.
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  # selector 없음 — 아래 EndpointSlice가 대상을 직접 지정한다.
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ai-host
  labels:
    kubernetes.io/service-name: ai
addressType: IPv4
ports:
  - name: http
    port: 8000
    protocol: TCP
endpoints:
  - addresses:
      - 100.64.193.109
