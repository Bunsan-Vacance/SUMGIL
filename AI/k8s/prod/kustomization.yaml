# AI Kustomize — 호스트 프로세스 연결 (임시, S15P21A104-211 이미지 전까지). namespace prod 참조 (생성은 Infra 소유).
# 호스트 systemd 프로세스라 이미지·ConfigMap·Secret이 무의미해 images·configMapGenerator·secretGenerator를 뺐다.
# 이미지 전환 시 복원: images(sumgil-ai → 100.103.156.53:30500/sumgil-ai:latest),
#   configMapGenerator(ai-config ← ai-config.env), secretGenerator(ai-secret ← ai-secret.env, 키는 ai-secret.env.example).
# ai-config.env·ai-secret.env.example은 그때 쓰려고 남겨둔다 (지금은 참조하지 않음).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ai.yaml
  - ingress.yaml
