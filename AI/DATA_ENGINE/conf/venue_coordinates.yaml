# 경기장 좌표 — 경기 이벤트를 인근 역에 연결하기 위한 것.
#
# 축제 데이터(`festival_capital.parquet`)는 원본에 lon/lat이 있지만 경기장은 일정·관중수
# 어느 원천에도 좌표가 없어 여기에 따로 둔다.
#
# ⚠️ 2026-09-09 기준 **근사 좌표**다. 인천문학만 공식 홈페이지(mhstadium.co.kr) 값이고
# 나머지는 검증된 1차 출처를 확보하지 못했다. 다만 용도가 "반경 몇 km 안의 역 찾기"라
# 수백 m 오차는 결과를 바꾸지 않으며, `map_events_to_stations.py`가 각 경기장의 최근접
# 역 이름을 출력하므로 좌표가 크게 틀리면 바로 드러난다(잠실야구장→종합운동장처럼
# 예상되는 역이 안 나오면 좌표를 의심할 것).

# KBO — 관중수를 수집한 4구장(`kbo_crowd_backfill.STADIUMS`)과 이름을 맞춘다.
kbo:
  잠실: { lat: 37.5121, lon: 127.0719 } # 잠실야구장(종합운동장 단지)
  고척: { lat: 37.4982, lon: 126.8671 } # 고척스카이돔
  문학: { lat: 37.436734, lon: 126.690554 } # 인천문학경기장 (공식 홈페이지)
  수원: { lat: 37.2997, lon: 127.0097 } # 수원 KT위즈파크(수원종합운동장 단지)

# K리그 — `filter_kleague_seoul_metro.SEOUL_METRO_STADIUMS`와 이름을 맞춘다.
kleague:
  서울 월드컵: { lat: 37.5683, lon: 126.8974 }
  목동 종합: { lat: 37.5423, lon: 126.8752 }
  수원 월드컵: { lat: 37.2861, lon: 127.0367 }
  수원 종합: { lat: 37.2997, lon: 127.0097 } # KT위즈파크와 같은 단지
  안양 종합: { lat: 37.4017, lon: 126.9463 }
  부천 종합: { lat: 37.5052, lon: 126.7942 }
  인천 전용: { lat: 37.4699, lon: 126.6438 } # 인천축구전용경기장

# 이 반경 안의 역을 "그 경기장의 영향권"으로 본다. 도보 접근 한계를 넉넉히 잡은 값으로,
# 경기장은 보통 전용역이 붙어 있어 1.5km면 1~2개 역이 잡힌다.
radius_km: 1.5
