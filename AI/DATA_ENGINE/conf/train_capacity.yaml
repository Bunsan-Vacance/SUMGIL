# 호선별 편성 량수와 열차 정원 — 혼잡도(%) 계산의 분모.
#
# 국토교통부 고시 제2023-414호가 열차 혼잡도를 "탑승기준인원 대비 실제 탑승비율"로
# 정의하므로, 재차인원을 이 정원으로 나눠야 공식 정의와 같은 축의 값이 나온다.
#
# 2026-09-09 웹 조사로 확인. 1차 자료(서울교통공사 차량 현황 공표자료)가 아니라 2차
# 출처들의 교차 확인이라, 공식 자료를 확보하면 대조 후 갱신할 것.
#   - 1량 정원 160명(좌석 54 + 입석 106), 혼잡도 100% 기준:
#     https://blog.hyundai-rotem.co.kr/365
#   - 호선별 편성 량수: https://news.seoul.go.kr/traffic/archives/1551
#     https://ko.wikipedia.org/wiki/서울교통공사_8000호대_전동차
#
# 주의: 이 값은 "정원"이지 물리적 최대 수용인원이 아니다. 혼잡도는 200%를 넘을 수 있고
# (실제로 9호선 급행이 그렇다) 그건 오류가 아니라 정상 범위다 — 상한으로 자르지 말 것.

# 전동차 1량의 정원. 혼잡도 100%의 기준값이다.
car_capacity: 160

# 본선 기준 편성 량수.
#
# 지선은 편성이 달라 정원도 다른데(2호선 성수지선 4량, 신정지선 6량), 그 값은 여기가 아니라
# `line_topology.yaml`의 각 구간에 `cars_per_train`으로 붙어 있다. 지선은 "어느 역이 그
# 지선인가"와 "몇 량인가"가 한 몸이라 역 순서를 정의한 곳에 같이 두는 편이 어긋날 여지가
# 적다 — `build_congestion_label.py`가 구간 값을 먼저 보고 없을 때만 이 표를 쓴다.
# (1호선 광명셔틀은 금천구청·광명이 코레일 소속이라 승하차 데이터에 아예 없어 대상이 아니다.)
cars_per_train:
  1호선: 10
  2호선: 10
  3호선: 10
  4호선: 10
  5호선: 8
  6호선: 8
  7호선: 8
  8호선: 6

# 국토교통부고시 제2023-414호 — 열차 혼잡도 4단계 임계치(%).
# 서비스 등급 표출을 이 기준에 맞추면 법적 근거가 생긴다.
congestion_levels:
  보통: [0, 150]
  주의: [150, 170]
  혼잡: [170, 190]
  심각: [190, null]  # 상한 없음
