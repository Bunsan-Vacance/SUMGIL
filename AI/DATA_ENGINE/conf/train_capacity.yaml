# 호선별 편성 량수와 열차 정원 — 혼잡도(%) 계산의 분모.
#
# 국토교통부 고시 제2023-414호가 열차 혼잡도를 "탑승기준인원 대비 실제 탑승비율"로
# 정의하므로, 재차인원을 이 정원으로 나눠야 공식 정의와 같은 축의 값이 나온다.
#
# 2026-09-09 웹 조사로 확인. 1차 자료(서울교통공사 차량 현황 공표자료)가 아니라 2차
# 출처들의 교차 확인이라, 공식 자료를 확보하면 대조 후 갱신할 것.
#   - 1량 정원 160명(좌석 54 + 입석 106), 혼잡도 100% 기준:
#     https://blog.hyundai-rotem.co.kr/365
#   - 호선별 편성 량수: https://news.seoul.go.kr/traffic/archives/1551
#     https://ko.wikipedia.org/wiki/서울교통공사_8000호대_전동차
#
# 2026-09-10 추가 조사(9호선). 1량 정원은 위 160명과 같은 값을 쓴다 — 9호선 관련 보도에서도
# "정원 160명, 혼잡도 300% 육박" 식으로 같은 기준이 확인된다. 편성 량수는 별도 확인:
#   - 9호선은 2015년 2단계 개통 후에도 한동안 4량 편성이라 혼잡도가 급증했고, 2017년 말까지
#     16편성을 6량화해 급행에 우선 투입, 2019년 11월 전 편성(1~3단계 공용) 6량화가
#     완료됐다: https://namu.wiki/w/서울 지하철 9호선
#   - 우리 데이터 구간(2025~2026)은 이 전환이 끝난 뒤라 전량 6량으로 본다 — 4량이던
#     2015~2019년 구간을 다루게 되면 이 값을 그대로 쓰면 안 된다.
#
# 주의: 이 값은 "정원"이지 물리적 최대 수용인원이 아니다. 혼잡도는 200%를 넘을 수 있고
# (실제로 9호선 급행이 그렇다) 그건 오류가 아니라 정상 범위다 — 상한으로 자르지 말 것.
#
# 2026-09-10 1차 자료 재확인 시도(11번). 서울교통공사 공식 "차량 현황 공표자료" PDF 자체는
# 여전히 못 찾았다 — 홈페이지(seoulmetro.co.kr) 정보공개 게시판에 후보 글이 있었지만
# SSL 인증서 오류로 자동 조회가 막혔다(수동 확인 필요, 브라우저로는 될 수 있음). 대신
# **독립적인 교차검증 하나**를 찾았다: 국토부 혼잡도 정의 해설 자료에 "좌석만 다 찼을 때
# 혼잡도를 34%로 산정한다"는 설명이 있는데, 54(좌석) / 160(정원) = 33.75% ≈ 34%로 정확히
# 들어맞는다. `AI/README.md` §2.1의 착석 기회 지수가 원래부터 34%를 착석/입석 경계로 쓰는
# 것도 이 정의에서 나온 값이라, 160명·54석이 서로 다른 두 방향(정원 자체의 출처, 혼잡도
# 정의와의 정합성)에서 맞아떨어진다. 완전한 1차 자료 확보는 아니지만 신뢰도가 올라간 상태다.

# 전동차 1량의 정원. 혼잡도 100%의 기준값이다.
car_capacity: 160

# 본선 기준 편성 량수.
#
# 지선은 편성이 달라 정원도 다른데(2호선 성수지선 4량, 신정지선 6량), 그 값은 여기가 아니라
# `line_topology.yaml`의 각 구간에 `cars_per_train`으로 붙어 있다. 지선은 "어느 역이 그
# 지선인가"와 "몇 량인가"가 한 몸이라 역 순서를 정의한 곳에 같이 두는 편이 어긋날 여지가
# 적다 — `build_congestion_label.py`가 구간 값을 먼저 보고 없을 때만 이 표를 쓴다.
# (1호선 광명셔틀은 금천구청·광명이 코레일 소속이라 승하차 데이터에 아예 없어 대상이 아니다.)
cars_per_train:
  1호선: 10
  2호선: 10
  3호선: 10
  4호선: 10
  5호선: 8
  6호선: 8
  7호선: 8
  8호선: 6
  # 2·3단계(언주~중앙보훈병원, 이번 스코프)만 대상 — 1단계(개화~신논현)는 승하차 원천이
  # 없어 이번 범위에서 제외했다(Notion [CROWD] 혼잡도 / "9호선 1단계 스코프 제외" 참고).
  # 값 자체는 전 구간(1~3단계) 공용 6량이라 1단계를 나중에 편입해도 그대로 쓸 수 있다.
  9호선: 6

# 국토교통부고시 제2023-414호 — 열차 혼잡도 4단계 임계치(%).
# 서비스 등급 표출을 이 기준에 맞추면 법적 근거가 생긴다.
congestion_levels:
  보통: [0, 150]
  주의: [150, 170]
  혼잡: [170, 190]
  심각: [190, null]  # 상한 없음
