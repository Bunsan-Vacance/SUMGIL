# 호선별 역 물리 순서 — 재차인원 재귀 누적의 진행 방향을 정의한다.
#
# **`station_no` 정렬로는 안 된다.** 대체로 번호가 노선 순서를 따르지만 예외가 있다:
#   - 1호선 동묘앞(159)은 실제로 동대문(155)과 신설동(156) 사이인데 번호는 끝에 붙어 있다
#     (나중에 개통돼 번호를 뒤에 받은 것). 「서울교통공사_지하철혼잡도정보」CSV의 행 순서도
#     역번호 정렬이라 여기서도 틀리다 — 2026-09-09 대조 확인.
#   - 2·5호선은 지선이 본선 번호 뒤에 몰려 있어 번호순으로 이으면 없는 선로를 잇게 된다.
#
# `range: [a, b]`는 a부터 b까지의 역번호를 뜻하고, 패널에 실제로 있는 역만 남긴다 —
# 3호선 321(충무로)·6호선 2615(연신내)처럼 물리적으로는 그 호선에 있지만 승하차가 다른
# 호선에 계상돼 우리 데이터에 없는 역이 자동으로 빠진다(그 지점에서 재귀가 끊기므로
# 스크립트가 결번을 인벤토리로 출력한다).
#
# `truncated: true`는 양 끝이 실제 종점이 아니라 절단면이라는 뜻이다. 서울교통공사 관할
# 구간만 있고 코레일 직결 구간이 없어서 그렇다 — 이 구간은 "종점 재차인원 0" 제약을
# 검증에 쓸 수 없다(들어온 채로 시작하고 실은 채로 끝나는 게 정상).

segments:
  - line: "1호선"
    segment: "본선"
    truncated: true # 서울교통공사 구간(서울역~청량리)뿐. 양 끝 모두 코레일로 이어진다.
    stations: [150, 151, 152, 153, 154, 155, 159, 156, 157, 158]

  - line: "2호선"
    segment: "본선"
    circular: true # 순환선이라 종점이 없다. 충정로(243) 다음이 시청(201).
    stations:
      - range: [201, 243]

  - line: "2호선"
    segment: "성수지선"
    cars_per_train: 4
    stations: [211, 244, 245, 250, 246] # 성수-용답-신답-용두-신설동

  - line: "2호선"
    segment: "신정지선"
    cars_per_train: 6
    # 종점 까치산은 승하차가 5호선(2519)에 계상돼 여기 없다 — 그래서 끝이 절단면이다.
    truncated: true
    stations: [234, 247, 248, 249] # 신도림-도림천-양천구청-신정네거리

  - line: "3호선"
    segment: "본선"
    truncated: true # 지축~오금만. 대화 방면(일산선)은 코레일.
    stations:
      - range: [309, 342]

  - line: "4호선"
    segment: "본선"
    truncated: true # 불암산~남태령만. 진접·안산 방면은 코레일.
    stations:
      - range: [409, 434]

  - line: "5호선"
    segment: "본선"
    stations:
      - range: [2511, 2549] # 방화~강동

  - line: "5호선"
    segment: "하남선"
    # 강동(2549)에서 분기. 상일동(2554) 다음이 강일(2562)로, 번호가 뛴다.
    stations: [2549, 2550, 2551, 2552, 2553, 2554, 2562, 2563, 2564, 2565, 2566]

  - line: "5호선"
    segment: "마천지선"
    stations: [2549, 2555, 2556, 2557, 2558, 2559, 2560, 2561] # 강동~마천

  - line: "6호선"
    segment: "본선"
    # 응암~새절은 단선 순환이라 한 방향으로만 돈다(봉화산행만 역촌·불광·독바위·구산 경유,
    # 응암행은 새절에서 응암으로 직행). 여기서는 순환 구간을 포함한 한 줄로 두고, 방향별
    # 차이는 실측 대조에서 드러나게 한다 — 미해결 항목.
    stations:
      - range: [2611, 2648]

  - line: "7호선"
    segment: "본선"
    truncated: true # 장암~온수만. 부평구청 방면은 인천교통공사.
    stations:
      - range: [2711, 2752]

  - line: "8호선"
    segment: "본선"
    stations:
      - range: [2810, 2828]

  - line: "9호선"
    segment: "2·3단계"
    truncated: true # 언주 쪽이 실제 종점이 아니라 절단면이다 — 1단계(개화~신논현)는
    # 운영사가 서울시메트로9호선(민간)이라 일별 승하차 원천이 없어 이번 스코프에서
    # 제외했다(Notion [CROWD] 혼잡도 / "9호선 1단계 스코프 제외" 참고). 중앙보훈병원
    # 쪽은 실제 종점이다.
    #
    # 역번호 **내림차순**(중앙보훈병원→언주)으로 둔다 — 1~8호선과 반대다. 2026-09-10
    # 실측 검증(종합운동장 기준, 평일 일반): 출근(07-09시) 하선 67.1% vs 상선 17.2%,
    # 퇴근(18-20시) 상선 58.0% vs 하선 17.5% — 도심 방향(언주 쪽, 역번호 감소 방향)으로
    # 몰리는 출근시간대가 "하선"이다. ASCENDING="하선" 전역 상수(1~8호선 기준, 역번호
    # 증가=하선)를 코드 변경 없이 그대로 쓰려면, 9호선은 리스트 자체를 내림차순으로
    # 둬서 "리스트상 증가 방향"이 "역번호 감소 방향"이 되게 맞춰야 한다.
    stations: [4138, 4137, 4136, 4135, 4134, 4133, 4132, 4131, 4130, 4129, 4128, 4127, 4126]
