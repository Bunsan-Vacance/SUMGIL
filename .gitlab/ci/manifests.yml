# 매니페스트 검증 (Kustomize) — 테스트 스테이지 무관하게 항상 실행 가능.
# 매니페스트 변경의 1차 방어선. 더미 Secret으로 렌더만 확인하고 값은 커밋하지 않는다.
kustomize-validate:
  stage: test
  image: alpine:3.20
  tags:
    - CI
  rules:
    - changes:
        - "Infra/**/*"
        - "BE/k8s/**/*"
        - "FE/k8s/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/*.yml"
  before_script:
    - apk add --no-cache kubectl
    # secretGenerator가 env 파일을 요구한다. 키 이름은 각 .env.example과 동일하게 맞춘다.
    - printf 'DB_PASSWORD=dummy\n' > Infra/k8s/prod/.env.secret
    - printf 'SEOUL_SUBWAY_KEY=dummy\nSEOUL_API_KEY=dummy\nSEOUL_BIKE_KEY=dummy\nKMA_API_KEY=dummy\n' > BE/k8s/prod/.env.secret
  script:
    - kubectl kustomize Infra/k8s > /dev/null
    - kubectl kustomize BE/k8s/prod > /dev/null
    - kubectl kustomize FE/k8s/prod > /dev/null
  after_script:
    - rm -f Infra/k8s/prod/.env.secret BE/k8s/prod/.env.secret
