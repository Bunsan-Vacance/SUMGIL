# FE 워크로드 (S15P21A104-126). namespace 생성 없음 (Infra 소유 prod 참조).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
spec:
  # replicas 1 고정 (S15P21A104-210). 정적 서빙·무상태라 2의 이득이 없다. 무중단 필요 시 2와 함께 올린다.
  replicas: 1
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      containers:
        - name: fe
          image: sumgil-fe:latest
          # SHA 태그는 불변이라 재pull이 필요 없다. :latest는 호환용으로만 push된다.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: fe
spec:
  selector:
    app: fe
  ports:
    - port: 80
