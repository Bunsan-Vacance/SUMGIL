# FE GitOps Application (S15P21A104-129). 작성만, 설치 제외.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sumgil-fe
  namespace: argocd
spec:
  destination:
    namespace: prod
    server: https://kubernetes.default.svc
  project: default
  source:
    path: FE/k8s/prod
    repoURL: https://lab.ssafy.com/s15-bigdata-dist-sub1/S15P21A104
    targetRevision: develop-FE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
