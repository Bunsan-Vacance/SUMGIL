stages:
  - lint
  - test

# 파트별 CI 정의. 루트는 공통(workflow·guard·AI)만 두고 BE/FE/매니페스트는 분리한다.
include:
  - local: .gitlab/ci/be.yml
  - local: .gitlab/ci/fe.yml
  - local: .gitlab/ci/manifests.yml

# MR + main push에서만 파이프라인을 만든다. 브랜치 push는 MR 파이프라인과
# 중복 검증이 되므로 만들지 않는다 (MR 머지가 main push 파이프라인 1회로 이어진다).
# main push 허용은 SHA 배포(210-②)의 전제다.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

# AI·BE 검사 대상이 없는 MR도 빈 파이프라인으로 실패하지 않게 한다.
# 각 검사의 changes 목록을 공유해 AI 문서만 바뀐 경우에도 guard가 실행되게 한다.
mr-guard:
  stage: lint
  image: alpine:3.20
  tags:
    - CI
  rules:
    - changes: &ai_trigger_paths
        - "AI/**/*.py"
        - "AI/pyproject.toml"
        - "AI/requirements.txt"
        - "AI/requirements-dev.txt"
        - "AI/requirements-ci.txt"
        - ".gitlab-ci.yml"
      when: never
    - changes: &be_trigger_paths
        - "BE/**/*"
      when: never
    - when: on_success
  script:
    - echo "AI/BE 검사 대상 변경이 없는 MR입니다. 검증 대상이 없어 통과 처리합니다."

.ai_job:
  image: python:3.11-slim
  tags:
    - CI
  rules:
    - changes: *ai_trigger_paths
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: ai-pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - cd AI
    # requirements-dev.txt는 requirements.txt(torch·pyspark·geopandas 등 프로덕션 전체)를
    # 통째로 끌어와 GB 단위라 매번 오래 걸린다. CI는 실제 테스트가 쓰는 것만 담은
    # requirements-ci.txt를 쓴다 — 갱신 기준은 그 파일 상단 주석 참고.
    - pip install -r requirements-ci.txt

ai-lint:
  extends: .ai_job
  stage: lint
  script:
    - ruff check .
    - black --check .

ai-test:
  extends: .ai_job
  stage: test
  script:
    - pytest -q
