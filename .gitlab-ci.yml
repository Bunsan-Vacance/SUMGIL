stages:
  - lint
  - test

# MR 이벤트에서만 파이프라인을 만든다. 이게 없으면 브랜치 push(예: MR 머지로 develop-*에
# 커밋이 반영되는 순간)도 rules:changes만 보고 별도 파이프라인을 또 만들어서, 같은 diff를
# MR 때 한 번·머지 때 한 번 이렇게 중복 검증하게 된다.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ai-lint/ai-test를 실제로 돌리는 변경 패턴. mr-guard와 .ai_job이 이 목록을 그대로
# 공유해야 한다 — 두 곳의 패턴이 어긋나면(예: 한쪽만 넓혀 갱신) 어느 쪽도 안 도는
# 사각지대가 다시 생긴다.
.ai_trigger_paths: &ai_trigger_paths
  - "AI/**/*.py"
  - "AI/pyproject.toml"
  - "AI/requirements.txt"
  - "AI/requirements-dev.txt"
  - "AI/requirements-ci.txt"

# ai-lint/ai-test는 changes:로 걸러지므로, 위 패턴에 안 걸리는 MR(문서·기획, 혹은
# AI/ 안이라도 .py·requirements가 아닌 변경 — README, 스크립트 등)은 잡이 하나도
# 안 생긴다. GitLab은 잡 0개 파이프라인을 "No stages / jobs for this pipeline"로
# 거부해 MR이 실패로 표시되므로, 그 경우에만 대신 실행돼 파이프라인을 비지 않게 한다.
# 스킵 조건을 .ai_trigger_paths와 동일하게 맞춰서 "둘 다 안 도는" 사각지대를 없앤다.
mr-guard:
  stage: lint
  image: alpine:3.20
  tags:
    - CI
  rules:
    - changes: *ai_trigger_paths
      when: never
    - when: on_success
  script:
    - echo "ai-lint/ai-test 대상 변경이 없는 MR입니다. 검증 대상이 없어 통과 처리합니다."

.ai_job:
  image: python:3.11-slim
  tags:
    - CI
  rules:
    - changes: *ai_trigger_paths
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: ai-pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - cd AI
    # requirements-dev.txt는 requirements.txt(torch·pyspark·geopandas 등 프로덕션 전체)를
    # 통째로 끌어와 GB 단위라 매번 오래 걸린다. CI는 실제 테스트가 쓰는 것만 담은
    # requirements-ci.txt를 쓴다 — 갱신 기준은 그 파일 상단 주석 참고.
    - pip install -r requirements-ci.txt

ai-lint:
  extends: .ai_job
  stage: lint
  script:
    - ruff check .
    - black --check .

ai-test:
  extends: .ai_job
  stage: test
  script:
    - pytest -q
