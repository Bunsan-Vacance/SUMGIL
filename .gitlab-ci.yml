workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - lint
  - test

.ai_job:
  image: python:3.11-slim
  tags:
    - CI
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "AI/**/*.py"
        - "AI/pyproject.toml"
        - "AI/requirements.txt"
        - "AI/requirements-dev.txt"
        - ".gitlab-ci.yml"
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: ai-pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - cd AI
    - pip install -r requirements-dev.txt

ai-lint:
  extends: .ai_job
  stage: lint
  script:
    - ruff check .
    - black --check .

ai-test:
  extends: .ai_job
  stage: test
  script:
    - pytest -q

fe-check:
  image: node:24-slim
  tags:
    - CI
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "FE/**/*"
        - ".gitlab-ci.yml"
  before_script:
    - cd FE
    - npm ci
  script:
    - npm run format:check
    - npm test
    - npm run build
