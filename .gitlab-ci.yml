stages:
  - lint
  - test
  - build
  - deploy

# 파트별 CI 정의. 루트는 공통(workflow·guard·AI)만 두고 파트별 정의는 분리한다.
# 네이밍: 파트-동작 (be-test·be-image·fe-test·fe-image·manifests-validate·deploy-prod·ai-*).
include:
  - local: .gitlab/ci/be.yml
  - local: .gitlab/ci/fe.yml
  - local: .gitlab/ci/manifests.yml
  - local: .gitlab/ci/deploy.yml

# MR·main·개발브랜치에서 파이프라인을 만든다.
# 개발 push는 lint/test 검증만 — build·deploy는 각 job의 main 한정 rules가 막는다.
# main push 허용은 SHA 배포의 전제다.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^(develop-.*|feat\/.*)$/'
    - when: never

# 검사 대상이 없는 파이프라인도 빈 파이프라인으로 실패하지 않게 한다.
# 각 검사의 changes 목록을 공유해 문서만 바뀐 경우에도 guard가 실행되게 한다.
mr-guard:
  stage: lint
  image: alpine:3.20
  tags:
    - CI
  rules:
    - changes: &ai_trigger_paths
        - "AI/**/*.py"
        - "AI/pyproject.toml"
        - "AI/requirements.txt"
        - "AI/requirements-dev.txt"
        - "AI/requirements-ci.txt"
        - ".gitlab-ci.yml"
      when: never
    - changes: &be_trigger_paths
        - "BE/**/*"
      when: never
    - changes: &fe_trigger_paths
        - "FE/**/*"
      when: never
    - changes: &manifests_trigger_paths
        - "Infra/**/*"
        - "BE/k8s/**/*"
        - "FE/k8s/**/*"
        - "AI/k8s/**/*"
        - ".gitlab/ci/*.yml"
      when: never
    - when: on_success
  script:
    - echo "검사 대상 변경이 없는 파이프라인입니다. 검증 대상이 없어 통과 처리합니다."

.ai_job:
  image: python:3.11-slim
  tags:
    - CI
  rules:
    - changes: *ai_trigger_paths
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: ai-pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - cd AI
    # requirements-dev.txt는 requirements.txt(torch·pyspark·geopandas 등 프로덕션 전체)를
    # 통째로 끌어와 GB 단위라 매번 오래 걸린다. CI는 실제 테스트가 쓰는 것만 담은
    # requirements-ci.txt를 쓴다 — 갱신 기준은 그 파일 상단 주석 참고.
    - pip install -r requirements-ci.txt

ai-lint:
  extends: .ai_job
  stage: lint
  script:
    - ruff check .
    - black --check .

ai-test:
  extends: .ai_job
  stage: test
  script:
    - pytest -q
