# ClusterIssuer 2종 (S15P21A104-210 ④ TLS).
# 도메인 소유가 아니라 사용권만 있어 DNS-01은 불가 — HTTP-01로 간다.
# 80포트로 해당 도메인을 서빙 중이므로 제어 증명이 성립한다. 외부 DNS 변경 불필요.
# 순서는 반드시 staging → 확인 → prod. rate limit 회피용.
# ACME_EMAIL은 만료 알림 수신용 — 적용 전에 실제 주소로 교체한다 (⬜).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
