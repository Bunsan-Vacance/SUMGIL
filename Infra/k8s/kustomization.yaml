# Infra Kustomize 루트 (S15P21A104-124/126). 클러스터 스코프 리소스만.
# - namespaces/: 앱이 사는 네임스페이스 (클러스터 스코프라 Infra 소유)
# - ingress-nginx/: ingress 컨트롤러 (k3s 내장 Traefik은 끈다)
# 앱 워크로드는 BE/k8s, FE/k8s에 있다 (소유 분리).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces/
  - ingress-nginx/
