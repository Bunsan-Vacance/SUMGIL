# node-exporter — 노드 지표 + AI 배치 textfile 지표 (S15P21A104-341).
# hostPath·hostNetwork 사용 → Infra 소유. 양 노드(control-plane 포함)에 하나씩 뜬다.
# textfile 경로는 AI/scripts/crowd-score-daily.service 의 SUMGIL_TEXTFILE_DIR 과 일치해야 한다.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  labels:
    app.kubernetes.io/component: node-exporter
spec:
  clusterIP: None # headless — Prometheus 가 endpoints 로 노드별 발견
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
    app.kubernetes.io/component: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.9.1
          args:
            - --path.rootfs=/host
            - --collector.textfile.directory=/textfile
            - --web.listen-address=:9100
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: textfile
              mountPath: /textfile
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
      volumes:
        - name: root
          hostPath:
            path: /
        - name: textfile
          hostPath:
            path: /var/lib/node_exporter/textfile
            type: DirectoryOrCreate
