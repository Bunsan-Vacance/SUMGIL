# 로컬 통합 실행용 골격.
# 각 파트의 Dockerfile이 만들어지기 전까지는 build 대상이 없어 그대로는 뜨지 않는다.
# 파트별 Dockerfile 추가 → 주석 해제 순으로 진행한다.

services:
  # fe:
  #   build: ../../FE
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8080

  # be:
  #   build: ../../BE
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=local
  #   depends_on:
  #     - postgres
  #     - redis

  postgres:
    image: postgres:16
    container_name: sumgil-postgres
    environment:
      POSTGRES_DB: sumgil
      POSTGRES_USER: sumgil
      POSTGRES_PASSWORD: sumgil1234
    ports:
      - "5432:5432"
    volumes:
      - sumgil_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sumgil-redis
    ports:
      - "6379:6379"
    volumes:
      - sumgil_redis_data:/data

  # 수집기 → 컨슈머(Redis 반영 · AI Spark) 사이의 버퍼. S15P21A104-74 PoC 구성.
  # 4.x 라 ZooKeeper 가 없다(KRaft 단독). 웹의 ZooKeeper 기반 예제를 섞으면 뜨지 않는다.
  # 이미지 태그는 BE 가 쓰는 kafka-clients 와 맞췄다 — Spring Boot 4.1.1 BOM 이 4.2.1 을 관리한다.
  kafka:
    image: apache/kafka:4.2.1
    container_name: sumgil-kafka
    ports:
      # 호스트(IDE·gradlew·수집기)가 붙는 포트. 컨테이너끼리 쓰는 19092 는 공개하지 않는다.
      - "9092:9092"
    environment:
      # ── KRaft: 브로커와 컨트롤러를 한 프로세스에서 겸한다 (단일 노드) ──
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 볼륨에 남은 메타데이터와 어긋나면 기동이 실패하므로 고정값을 쓴다.
      CLUSTER_ID: sumgil-kafka-poc-0001

      # ── 리스너 2개: 안에서 붙는 길과 밖에서 붙는 길 ──
      # 컨테이너끼리는 INTERNAL(kafka:19092), 호스트에서는 EXTERNAL(localhost:9092).
      # advertised 는 "클라이언트가 실제로 접속할 주소"를 브로커가 되돌려주는 값이다.
      # 여기를 한 이름으로 합치면 한쪽에서만 조용히 타임아웃 난다 — 가장 흔한 함정.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ── 단일 브로커라 복제본을 1로 낮춘다. 기본값 3이면 내부 토픽 생성이 막힌다 ──
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 소스별 토픽 1개·파티션 1 (아키텍처 설계서 확정). 순서 보장이 재고·도착 반영에 필요하다.
      KAFKA_NUM_PARTITIONS: 1
      # 로컬 기본값은 1GB 다. 개발 PC 에서 Postgres·Redis 와 같이 뜨므로 줄인다.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - sumgil_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - fe
  #     - be

volumes:
  sumgil_postgres_data:
  sumgil_redis_data:
  sumgil_kafka_data:
