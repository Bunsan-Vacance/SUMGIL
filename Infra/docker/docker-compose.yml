# 로컬 통합 실행용 골격.
# 각 파트의 Dockerfile이 만들어지기 전까지는 build 대상이 없어 그대로는 뜨지 않는다.
# 파트별 Dockerfile 추가 → 주석 해제 순으로 진행한다.

services:
  # fe:
  #   build: ../../FE
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8080

  # be:
  #   build: ../../BE
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=local
  #   depends_on:
  #     - postgres
  #     - redis

  postgres:
    image: postgres:16
    container_name: sumgil-postgres
    environment:
      POSTGRES_DB: sumgil
      POSTGRES_USER: sumgil
      POSTGRES_PASSWORD: sumgil1234
    ports:
      - "5432:5432"
    volumes:
      - sumgil_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sumgil-redis
    ports:
      - "6379:6379"
    volumes:
      - sumgil_redis_data:/data

  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - fe
  #     - be

volumes:
  sumgil_postgres_data:
  sumgil_redis_data:
